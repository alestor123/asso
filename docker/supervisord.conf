[supervisord]
loglevel=info
nodaemon=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=10

[program:backend]
command=uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/backend
autorestart=true
priority=20

[program:flask]
command=python app.py
directory=/app/flask-api
environment=PORT="6001"
autorestart=true
priority=30

[program:node]
command=node server.js
directory=/app/node-workload
environment=PORT="6002"
autorestart=true
priority=40
